name: Release APK (signed, draft)

# Alur rilis:
#   1. push tag vX.Y.Z  ->  workflow ini memvalidasi tag, menjalankan uji unit, lalu membangun APK release
#   2. APK ditandatangani dengan keystore dari GitHub Secrets (bila tersedia)
#   3. APK dilampirkan ke DRAFT release — belum publik sampai dipublikasikan manual
#   4. workflow "Cleanup CI traces" menghapus riwayat run + artifact task ini
#      setelah selesai; draft release dan APK-nya TIDAK dihapus (deliverable).
#
# Catatan rilis diambil dari docs/release-notes/<tag>.md bila ada.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v0.3.1-alpha)'
        required: true
        type: string
      notes:
        description: 'Catatan tambahan untuk catatan rilis (opsional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: sukios

jobs:
  release:
    name: Bangun APK bertanda tangan lalu buat draft release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Nama tag dan input dispatch dikendalikan pengirim; masuk lewat env, divalidasi, baru dipakai.
      - name: Validasi tag rilis
        id: tag
        working-directory: .
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag rilis tidak valid. Format: vX.Y.Z atau vX.Y.Z-sufiks (huruf, angka, titik)."
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan Android SDK (platform 35 + build-tools 35)
        working-directory: .
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'

      - name: Uji unit sebelum rilis
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Siapkan keystore dari secrets (bila ada)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.SUKIOS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/sukios-release.jks"
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "Keystore rilis disiapkan di runner. Nilainya tidak pernah dicetak ke log."
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signing rilis belum diset::Secrets keystore belum ada; APK akan memakai debug key dan ditandai tidak resmi pada catatan rilis."
          fi

      - name: Build release APK
        env:
          SUKIOS_KEYSTORE_FILE: ${{ steps.ks.outputs.signed == '1' && format('{0}/sukios-release.jks', runner.temp) || '' }}
          SUKIOS_KEYSTORE_PASSWORD: ${{ secrets.SUKIOS_KEYSTORE_PASSWORD }}
          SUKIOS_KEY_ALIAS: ${{ secrets.SUKIOS_KEY_ALIAS }}
          SUKIOS_KEY_PASSWORD: ${{ secrets.SUKIOS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Siapkan berkas APK dan metadata
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi
          OUT="SukiOS-${TAG}.apk"
          cp "$APK" "$OUT"
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          {
            echo "tag=${TAG}"
            echo "apk=${OUT}"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Buat draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.ks.outputs.signed }}
          NOTES_EXTRA: ${{ github.event.inputs.notes }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" = "1" ]; then
            SIGN_LINE="Ditandatangani dengan keystore rilis dari GitHub Secrets."
          else
            SIGN_LINE="PERINGATAN: ditandatangani dengan debug key karena secrets keystore rilis belum diset. Jangan dipakai untuk distribusi publik."
          fi

          # Merek dibaca dari satu sumber (Brand.kt), bukan diketik ulang di workflow.
          COMPANY="$(sed -n 's/.*COMPANY = "\(.*\)".*/\1/p' app/src/main/java/app/sukios/Brand.kt)"
          if [ -z "$COMPANY" ]; then
            echo "::error::Brand.COMPANY tidak terbaca dari Brand.kt."
            exit 1
          fi

          NOTES_FILE="../docs/release-notes/${TAG}.md"
          {
            echo "## SukiOS ${TAG}"
            echo
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
            else
              echo "Catatan rilis rinci belum ditulis untuk tag ini (docs/release-notes/${TAG}.md)."
            fi
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- versionName: \`${VERSION}\`"
            echo "- ${SIGN_LINE}"
            echo "- Status: build ini belum diuji di perangkat sampai ada laporan balik."
            echo
            echo "${NOTES_EXTRA}"
            echo
            echo "Panduan pakai: \`sukios/README.md\`."
            echo
            echo "Built by xykal — ${COMPANY}"
          } > "${RUNNER_TEMP}/notes.md"

          args=()
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            args+=(--target "${REF_NAME}")
          fi

          gh release create "${TAG}" "${APK}" \
            --draft \
            --title "SukiOS ${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${args[@]}"

          echo "Draft release dibuat. Riwayat run ini akan dibersihkan oleh workflow Cleanup CI traces; draft release tetap ada."
