name: Build APK

# Verifikasi pemeriksaan workflow, uji unit, dan kompilasi. Workflow ini TIDAK menyimpan artifact/APK:
# APK yang bisa dipasang diterbitkan lewat workflow Release (draft release).
# Setelah selesai, workflow "Cleanup CI traces" membersihkan riwayat run-nya.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sukios

jobs:
  build:
    name: Uji dan verifikasi kompilasi
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Periksa workflow (rantai pasok) dan data ikon (generator = berkas)
        working-directory: .
        run: |
          set -euo pipefail
          python3 tools/check_workflows.py --self-test
          python3 tools/check_workflows.py
          python3 tools/gen_glyphs.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Pastikan Android SDK (platform 35 + build-tools 35)
        working-directory: .
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "${ANDROID_SDK_ROOT}/platforms" || true

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'

      - name: Uji unit (WinEngine, ShellExec, ShellArgs, merek, kebersihan sumber)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release (debug-signed bila secrets keystore belum ada)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Ringkasan hasil
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = failed = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"uji unit: {total} dijalankan, {failed} gagal, {errors} error, {skipped} dilewati")
          PY
          echo "APK yang dihasilkan pada run ini:"
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true
          echo "(tidak diunggah sebagai artifact — pakai tag rilis untuk APK yang bisa dipasang)"
