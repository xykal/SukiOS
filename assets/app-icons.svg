    </g>
    <text class="lbl" x="28" y="78">Files</text>
  </g>

  <!-- 2. Notes -->
  <g transform="translate(104 24)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#g2)"/>
