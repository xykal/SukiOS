    <linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5468"/><stop offset="1" stop-color="#1A1F2B"/></linearGradient>
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5468"/><stop offset="1" stop-color="#242A38"/></linearGradient>
    <linearGradient id="g9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD08A"/><stop offset="1" stop-color="#35D0BA"/></linearGradient>
