    <linearGradient id="g11" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#242A38"/></linearGradient>
    <linearGradient id="g12" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB44C"/><stop offset="1" stop-color="#FF5F56"/></linearGradient>
