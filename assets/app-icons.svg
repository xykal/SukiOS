<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <title>SukiOS — Set ikon bawaan (24 dp, stroke 1.75, round)</title>
  <style>
    .col { }
    .lbl { font: 600 9px Inter, system-ui, sans-serif; fill: #A8B0C0; text-anchor: middle; }
    .ic  { fill: none; stroke: #F2F4F8; stroke-width: 1.75;
           stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="640" height="200" fill="#0B0D12"/>

  <!-- 1. Files -->
  <g transform="translate(20 24)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#g1)"/>
